[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quod"
version = "0.2.0"
description = "Claude-driven, computation-first mathematics research harness"
requires-python = ">=3.13,<3.15"
license = { text = "MIT" }
readme = "README.md"

[project.scripts]
quod = "quod.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quod"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:bitcount function is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py313"
