name = "QuodFormal"
version = "0.2.0"
defaultTargets = ["Quod"]

# Mathlib and formal-conjectures are pinned to the same Mathlib release (v4.33.1), so both share one
# Mathlib build cache. Transitive pins live in lake-manifest.json (commit it after `lake update`).
# LeanHammer: must precede mathlib so its shared deps (batteries/aesop/quote4) resolve to Mathlib's revs.
[[require]]
name = "Hammer"
git = "https://github.com/JOSHCLUNE/LeanHammer"
rev = "v4.33.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

# Open conjectures stated in Lean (Erdős, OEIS, MathOverflow, ...). Their definitions live in
# FormalConjecturesUtil; `quod source open fc <path>` imports the file natively.
[[require]]
name = "formal_conjectures"
git = "https://github.com/google-deepmind/formal-conjectures.git"
rev = "b86fdb9a8f2f83d2bb2b4281586705896c0c8208"

[[lean_lib]]
name = "Quod"
